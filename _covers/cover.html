<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Starfield Labs cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
:root{--f-head:"Archivo","Archivo Narrow","Arial Narrow",sans-serif;--f-body:"Archivo",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
.cover{container:cover / inline-size;position:relative;overflow:hidden;background:var(--c-bg);width:100vw;height:100vh}
.cover svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.dk{--c-bg:#03060B;--c-title:#F7FAFF;--c-eye:#8A97AB;--c-sub:#8A97AB;--c-accent:#FF4D00;--c-l1:rgba(247,250,255,.55);--c-l2:rgba(247,250,255,.25);--c-pill:rgba(247,250,255,.32);--c-pilltx:#F7FAFF}
.lt{--c-bg:#FFFFFF;--c-title:#03060B;--c-eye:#4A5670;--c-sub:#3B465C;--c-accent:#FF4D00;--c-l1:rgba(3,6,11,.6);--c-l2:rgba(3,6,11,.28);--c-pill:rgba(3,6,11,.4);--c-pilltx:#03060B}
.txt{position:absolute;left:5.5cqw;top:0;bottom:0;width:54cqw;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
.eye{font-family:var(--f-body);font-weight:600;font-size:max(9px,1.45cqw);letter-spacing:.14em;text-transform:uppercase;color:var(--c-eye);margin:0 0 2cqw}
.ttl{font-family:var(--f-head);font-stretch:62%;font-weight:800;text-transform:uppercase;line-height:.92;color:var(--c-title);margin:0;text-wrap:balance}
.rule{display:grid;gap:.5cqw;width:9cqw;margin:2.4cqw 0 2cqw}
.rule b{height:.55cqw;min-height:2px;border-radius:9px;background:var(--c-accent)}
.rule u{height:.16cqw;min-height:1px;background:var(--c-l1)}
.rule u+u{background:var(--c-l2)}
.sub{font-family:var(--f-body);font-size:max(11px,1.9cqw);line-height:1.45;color:var(--c-sub);margin:0;max-width:42cqw}
.pills{display:flex;gap:.9cqw;margin-top:2.2cqw}
.pill{font-family:var(--f-body);display:inline-flex;align-items:center;gap:.7cqw;border:1px solid var(--c-pill);border-radius:999px;padding:.55cqw 1.3cqw;font-size:max(8px,1.2cqw);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--c-pilltx);white-space:nowrap}
.pill i{width:.8cqw;height:.8cqw;min-width:5px;min-height:5px;border-radius:50%;background:var(--c-accent)}
@container cover (max-width:700px){.sub,.pill+.pill{display:none}.rule{margin:3cqw 0}}
</style></head>
<body><div id="c" class="cover"></div>
<script>
(function(){
  var s=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  function rng(seed){var h=1779033703^seed.length,i;for(i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}var a=h>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  function f(n){return Math.round(n*10)/10}
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function sky(s,mode){
    var dark=mode==='dark',r=rng(s.slug),id='x',i,k,out='';
    var P=dark?
      {star:'#F7FAFF',sOp:.2,sRange:.3,sR:1,orb:'#F7FAFF',orbOp:.2,planet:'#F7FAFF',spike:'#FFE9D9',spikeOp:.4,
       halo:[['0','#FFB27A','.85'],['.07','#FF6200','.55'],['.3','#FF6200','.18'],['1','#FF6200','0']],
       coreG:[['0','#FFFFFF','.9'],['1','#FFE3CC','0']],dot:'#FFFAF5',dot2:null}:
      {star:'#03060B',sOp:.1,sRange:.2,sR:1.1,orb:'#03060B',orbOp:.22,planet:'#03060B',spike:'#FF4D00',spikeOp:.5,
       halo:[['0','#FF6200','.5'],['.1','#FF6200','.34'],['.35','#FF6200','.1'],['1','#FF6200','0']],
       coreG:[['0','#FF4D00','.55'],['1','#FF4D00','0']],dot:'#FF4D00',dot2:'#FFF3EA'};
    function stops(a){return a.map(function(x){return '<stop offset="'+x[0]+'" stop-color="'+x[1]+'" stop-opacity="'+x[2]+'"/>'}).join('')}
    out+='<defs><radialGradient id="h-'+id+'">'+stops(P.halo)+'</radialGradient><radialGradient id="c-'+id+'">'+stops(P.coreG)+'</radialGradient>'+
      '<linearGradient id="sp-'+id+'"><stop offset="0" stop-color="'+P.spike+'" stop-opacity="0"/><stop offset=".5" stop-color="'+P.spike+'" stop-opacity="'+P.spikeOp+'"/><stop offset="1" stop-color="'+P.spike+'" stop-opacity="0"/></linearGradient>'+
      '<linearGradient id="spv-'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+P.spike+'" stop-opacity="0"/><stop offset=".5" stop-color="'+P.spike+'" stop-opacity="'+P.spikeOp+'"/><stop offset="1" stop-color="'+P.spike+'" stop-opacity="0"/></linearGradient></defs>';
    for(i=0;i<120;i++){out+='<circle cx="'+f(r()*1280)+'" cy="'+f(r()*720)+'" r="'+f(.5+r()*P.sR)+'" fill="'+P.star+'" opacity="'+f((P.sOp+r()*P.sRange)*100)/100+'"/>'}
    out+='<g transform="translate('+s.sx+' '+s.sy+')"><circle r="150" fill="url(#h-'+id+')"/>'+
      '<rect x="-210" y="-.6" width="420" height="1.2" fill="url(#sp-'+id+')" opacity=".5"/><rect x="-.6" y="-210" width="1.2" height="420" fill="url(#spv-'+id+')" opacity=".5"/><g transform="rotate('+s.tilt+')">';
    var base=250,rx,ry;
    for(k=0;k<s.level;k++){rx=base*(1+.55*k);ry=rx*.36;out+='<ellipse rx="'+f(rx)+'" ry="'+f(ry)+'" fill="none" stroke="'+P.orb+'" stroke-opacity="'+P.orbOp+'" stroke-width="1.2"/>'}
    rx=base;ry=base*.36;
    out+='<circle cx="'+f(rx*Math.cos(s.ang))+'" cy="'+f(ry*Math.sin(s.ang))+'" r="4.5" fill="'+P.planet+'"/></g>'+
      '<circle r="15" fill="url(#c-'+id+')"/><circle r="'+(dark?4.6:5.2)+'" fill="'+P.dot+'"/>'+(P.dot2?'<circle r="2" fill="'+P.dot2+'"/>':'')+'</g>';
    return '<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+out+'</svg>';
  }
  function size(t){var n=t.length;return n<=26?8.4:n<=42?7:n<=58?6:5.2}
  var el=document.getElementById('c'),pills='';
  if(s.pills&&s.pills.length){pills='<div class="pills">'+s.pills.map(function(p,i){return '<span class="pill">'+(i===0?'<i></i>':'')+esc(p)+'</span>'}).join('')+'</div>'}
  el.classList.add(s.mode==='dark'?'dk':'lt');
  el.innerHTML=sky(s,s.mode)+'<div class="txt"><p class="eye">Starfield Labs · '+esc(s.kind)+'</p><h3 class="ttl" style="font-size:'+size(s.title)+'cqw">'+esc(s.title)+'</h3><div class="rule"><b></b><u></u><u></u></div><p class="sub">'+esc(s.sub)+'</p>'+pills+'</div>';
})();
</script></body></html>
